apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: demo-aiops
type: Opaque
stringData:
  webhook-url: "https://hooks.slack.com/services/REPLACE/ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-detector
  namespace: demo-aiops
  labels:
    app: incident-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-detector
  template:
    metadata:
      labels:
        app: incident-detector
    spec:
      serviceAccountName: aiops-detector-sa
      containers:
        - name: detector
          image: ghcr.io/example/incident-detector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: NAMESPACE
              value: demo-aiops
            - name: DEPLOYMENT_NAME
              value: payments-api
            - name: LOKI_URL
              value: http://loki-gateway.monitoring.svc.cluster.local
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            - name: POLL_SECONDS
              value: "20"
            - name: ERROR_THRESHOLD
              value: "5"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: webhook-url
          volumeMounts:
            - name: audit
              mountPath: /var/run/aiops
      volumes:
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: incident-detector
  namespace: demo-aiops
spec:
  selector:
    app: incident-detector
  ports:
    - name: http
      port: 8081
      targetPort: 8081
