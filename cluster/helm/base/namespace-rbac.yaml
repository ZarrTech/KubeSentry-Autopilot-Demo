apiVersion: v1
kind: Namespace
metadata:
  name: demo-aiops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-detector-sa
  namespace: demo-aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-detector-role
  namespace: demo-aiops
rules:
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-detector-rb
  namespace: demo-aiops
subjects:
  - kind: ServiceAccount
    name: aiops-detector-sa
    namespace: demo-aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-detector-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-remediator-sa
  namespace: demo-aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-remediator-role
  namespace: demo-aiops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-remediator-rb
  namespace: demo-aiops
subjects:
  - kind: ServiceAccount
    name: aiops-remediator-sa
    namespace: demo-aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-remediator-role
